// Reviewed authored native population; update with actual test additions/removals.
def expectedNativeTests = 4

def nativeRun = minecraft.runs.getByName('gameTestServer')
def fixtureRoot = layout.buildDirectory.dir('gametest').get().asFile.canonicalFile
def withinFixtureRoot = { File directory -> directory.canonicalPath.startsWith(fixtureRoot.path + File.separator) }
// Keep an existing per-invocation evidence RunConfig (anchors); otherwise separate native
// tests from the shared client directory. No old working tree is reset or reconstructed.
if (!withinFixtureRoot(project.file(nativeRun.workingDirectory))) {
    nativeRun.workingDirectory(new File(fixtureRoot, UUID.randomUUID().toString()))
}
def configuredNativeDirectory = {
    def directory = project.file(nativeRun.workingDirectory).canonicalFile
    if (!withinFixtureRoot(directory)) throw new GradleException('Native RunConfig must use a fresh build/gametest fixture')
    directory
}
def prepareNativeProperties = { File properties ->
    if (!properties.exists()) {
        properties.parentFile.mkdirs()
        properties.text = '# Fresh source GameTest fixture: native defaults, no overrides.\n'
    }
}
def sha256 = { byte[] bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
def validateCompatibilityProof = { File directory, String text ->
    def proofFile = new File(directory, 'oc2r-compat-proof.json')
    if (!proofFile.isFile()) throw new GradleException('Missing fresh OC2R functional proof')
    def proof = new groovy.json.JsonSlurper().parse(proofFile)
    def receipt = new groovy.json.JsonSlurper().parse(new File(directory, 'source-fixture.json'))
    if (proof.schema != 'bc.oc2r_compat_proof.v1' || proof.fixture_directory != directory.canonicalPath ||
            proof.archive_sha256 != 'd6c42cffda0fa16734e14e26013320b4f1a05278544dd5c5b8d05914bfbb8632' ||
            proof.target_class_sha256 != '6f4a8b9c92b79f26695b3f21525e3c6c7649f16bb05903c11c8ce0e6d74bf0b8' ||
            proof.compat_provider_sha256 != receipt.compat_provider_sha256 ||
            !(proof.compat_provider_sha256 ==~ /[a-f0-9]{64}/) ||
            !(proof.compat_loaded_provider_sha256 ==~ /[a-f0-9]{64}/) ||
            proof.compat_provider_sha256 != sha256(new File(System.getenv('BC_CUSTOM_MOD_JAR_DIR') ?: '', 'better-compat-fixes-0.1.0.jar').bytes) ||
            proof.network != [echo_snapshot:true, caller_consumed:true, udp_roundtrip:true, tcp_roundtrip:true] ||
            proof.filesystems != [rootfs_sha256:'cf46784e33abfe678c5635a73deb6b3e8cf1b888492475ad8ba4eccc8902574b',
                scripts_zip_sha256:'34066cda83ea2b274fb0b27d03391ae190b067d6d13cc12af7795b8802cbba85', all_descriptors_loaded:true])
        throw new GradleException('Invalid OC2R functional proof binding/capabilities')
    def marker = 'BC_OC2R_COMPAT_V1 proof_sha256=' + sha256(proofFile.bytes)
    if (text.readLines().count { it.endsWith(marker) } != 1) throw new GradleException('Missing/duplicate native OC2R proof digest')
    true
}
def capabilityMessage = 'Loaded native library successfully but ICMP still failed, falling back to JVM UDP implementation'
def readmeMessage = 'Invalid path in pack: oc2r:file_systems/README.md, ignoring'
def verifyNativeDiagnostics = { String text, boolean validatedProof = false ->
    def errors = text.readLines().findAll { (it =~ /\[[^\]\r\n]*\/(?:ERROR|FATAL)\]/).find() }
    def counts = [capability:0, readme:0]
    def failures = errors.findAll { line ->
        if (validatedProof && line.endsWith('] [li.cil.oc2.common.Main.NativeLoader/]: ' + capabilityMessage) &&
                (line =~ /\[modloading-worker-\d+\/ERROR\]/).find()) { counts.capability++; return false }
        if (validatedProof && line.endsWith('] [net.minecraft.Util/]: ' + readmeMessage) &&
                (line =~ /\[Worker-Main-\d+\/ERROR\]/).find()) { counts.readme++; return false }
        true
    }
    if (failures || counts.values().any { it > 1 })
        throw new GradleException('Native ERROR/FATAL requires diagnosis: ' + (failures ?: errors).join('\n'))
}
def verifyNativeCompletion = { String text, int expected ->
    if (!text.contains('Started game test server') || !text.contains('Game test server shutting down'))
        throw new GradleException('Missing actual native server startup/shutdown proof')
    def completed = (text =~ /(?m)^.*?=+ (\d+) GAME TESTS COMPLETE =+.*$/).collect { it[1].toInteger() }
    def passed = (text =~ /(?m)^.*?All (\d+) required tests passed.*$/).collect { it[1].toInteger() }
    if (expected > 0 && (completed != [expected] || passed != [expected]))
        throw new GradleException("Incomplete native population: expected=${expected}, complete=${completed}, passed=${passed}")
    if (expected == 0 && (completed.any { it != 0 } || passed.any { it != 0 }))
        throw new GradleException('Startup-only smoke unexpectedly ran an unreviewed test population')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        // JavaExec.workingDir is populated later by ForgeGradle; it is NOT authoritative here.
        def directory = configuredNativeDirectory()
        if (new File(directory, 'world').exists() || new File(directory, 'logs/latest.log').exists() ||
                new File(directory, 'source-fixture.json').exists())
            throw new GradleException('Refusing reused native fixture: ' + directory)
        directory.mkdirs()
        new File(directory, 'source-fixture.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            working_directory: directory.absolutePath, expected_native_tests: expectedNativeTests,
            mode: expectedNativeTests == 0 ? 'dedicated_startup_smoke' : 'authored_gametests',
            old_world_absent: true, old_latest_log_absent: true,
            compat_provider_sha256: sha256(new File(System.getenv('BC_CUSTOM_MOD_JAR_DIR') ?: '', 'better-compat-fixes-0.1.0.jar').bytes),
            notices_provider_sha256: sha256(new File(System.getenv('BC_CUSTOM_MOD_JAR_DIR') ?: '', 'better-gameplay-notices-1.0.0.jar').bytes)
        ])) + '\n'
        prepareNativeProperties(new File(directory, 'server.properties'))
        copy {
            from([file('src/main/resources/gameteststructures'), file('src/gameteststructures'), file('gameteststructures')].findAll { it.isDirectory() })
            into(new File(directory, 'gameteststructures'))
            duplicatesStrategy = DuplicatesStrategy.FAIL
        }
        logger.lifecycle('Native GameTest RunConfig workingDirectory=' + directory)
    }
    doLast {
        def log = new File(configuredNativeDirectory(), 'logs/latest.log')
        if (!log.isFile()) throw new GradleException('Missing actual native log: ' + log)
        verifyNativeCompletion(log.text, expectedNativeTests)
        def validatedProof = validateCompatibilityProof(configuredNativeDirectory(), log.text)
        verifyNativeDiagnostics(log.text, validatedProof)
        if (!log.text.contains('mod=' + project.property('mod_id') + ' event=logging.status'))
            throw new GradleException('Missing own structured native startup status')
        logger.lifecycle('Verified actual native population=' + expectedNativeTests + '; unclassified ERROR/FATAL=0; exact OC2R compatibility proof bound; original audit retained')
    }
}

tasks.register('verifyNativeGameTestFixtureGuard') {
    group = 'verification'
    description = 'Checks absent-only settings, exact native counts and diagnostic rejection without Minecraft.'
    doLast {
        configuredNativeDirectory()
        def properties = layout.buildDirectory.file('native-fixture-guard/' + UUID.randomUUID() + '/server.properties').get().asFile
        prepareNativeProperties(properties)
        if (!properties.isFile() || !properties.readLines().every { !it || it.startsWith('#') })
            throw new GradleException('Fresh settings must exist without overriding native defaults')
        def existing = 'max-tick-time=123456\nlevel-name=retained-fixture\n'
        properties.text = existing
        prepareNativeProperties(properties)
        if (properties.text != existing) throw new GradleException('Preparation overwrote existing settings')
        verifyNativeDiagnostics('[00:00:00] [main/INFO] Native fixture ready')
        ['[00:00:00] [main/ERROR] Synthetic settings failure', '[00:00:00] [Server thread/FATAL] Synthetic native failure'].each { invalid ->
            boolean rejected = false
            try { verifyNativeDiagnostics(invalid) } catch (GradleException expected) { rejected = true }
            if (!rejected) throw new GradleException('Diagnostic guard accepted synthetic failure')
        }
        def capability = '[00:00:00] [modloading-worker-0/ERROR] [li.cil.oc2.common.Main.NativeLoader/]: ' + capabilityMessage
        def readme = '[00:00:00] [Worker-Main-0/ERROR] [net.minecraft.Util/]: ' + readmeMessage
        verifyNativeDiagnostics(capability + '\n' + readme, true)
        [capability, readme, capability.replace('NativeLoader', 'Other'), readme.replace('README.md', 'rootfs.json'),
         '[00:00:00] [main/ERROR] [li.cil.oc2.common.inet.DefaultSessionLayer/]: Failed to get echo response',
         capability + '\n' + capability].each { invalid ->
            boolean rejected = false
            try { verifyNativeDiagnostics(invalid, invalid != capability && invalid != readme) }
            catch (GradleException expected) { rejected = true }
            if (!rejected) throw new GradleException('Compatibility guard accepted unproven/changed/repeated failure')
        }
        def proofDirectory = properties.parentFile
        new File(proofDirectory, 'source-fixture.json').text = '{}'
        new File(proofDirectory, 'oc2r-compat-proof.json').text = '{}'
        boolean invalidProofRejected = false
        try { validateCompatibilityProof(proofDirectory, '') }
        catch (GradleException expected) { invalidProofRejected = true }
        if (!invalidProofRejected) throw new GradleException('Malformed/unbound functional proof accepted')
        def lifecycle = 'Started game test server\nGame test server shutting down\n'
        def success = lifecycle + '========= 3 GAME TESTS COMPLETE =========\nAll 3 required tests passed :)\n'
        verifyNativeCompletion(success, 3)
        verifyNativeCompletion(lifecycle, 0)
        [[success, 2], [lifecycle, 3], [success + success, 3], ['', 0],
         [success.replace('All 3 required tests passed :)', 'Some required tests failed'), 3]].each { invalid ->
            boolean rejected = false
            try { verifyNativeCompletion(invalid[0], invalid[1]) } catch (GradleException expected) { rejected = true }
            if (!rejected) throw new GradleException('Native population guard accepted incomplete/stale/duplicate proof')
        }
        logger.lifecycle('Native fixture guard: absent/defaults + preserve-existing + ERROR/FATAL + native-count negative controls PASS')
    }
}
tasks.matching { it.name == 'verifyFast' }.configureEach { dependsOn('verifyNativeGameTestFixtureGuard') }
